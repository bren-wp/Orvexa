name: Bootstrap Orvexa 0.0.4 source

on:
  push:
    branches:
      - develop/0.0.4
    paths:
      - ".github/bootstrap/orvexa-0.0.4.zip.b64"
      - ".github/workflows/bootstrap-004.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: develop/0.0.4
          fetch-depth: 0

      - name: Restore Orvexa 0.0.4 source tree
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=".github/bootstrap/orvexa-0.0.4.zip.b64"
          test -s "$PAYLOAD"
          base64 --decode "$PAYLOAD" > "$RUNNER_TEMP/orvexa-0.0.4.zip"
          unzip -t "$RUNNER_TEMP/orvexa-0.0.4.zip"
          mkdir -p "$RUNNER_TEMP/orvexa-source"
          unzip -q "$RUNNER_TEMP/orvexa-0.0.4.zip" -d "$RUNNER_TEMP/orvexa-source"
          cp -a "$RUNNER_TEMP/orvexa-source/." .
          rm -rf .github/bootstrap

      - name: Verify restored source
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/PRIVACY.md
          test -f .github/workflows/ci.yml
          test -f .github/workflows/release.yml
          test -f apps/windows/Orvexa.App/Orvexa.App.csproj
          test -f apps/web/index.html
          test -f shared/catalog.json
          test -f qa/orvexa.test.mjs
          node -e "const m=require('./build/version.json'); if(m.version!=='0.0.4'||m.channel!=='stable') process.exit(2)"
          npm run qa

      - name: Commit complete 0.0.4 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Harden Orvexa 0.0.4 stability and release pipeline"
          git push origin HEAD:develop/0.0.4
