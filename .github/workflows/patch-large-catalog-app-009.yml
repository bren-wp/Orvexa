name: Orvexa Patch Large Catalog App 0.0.9

on:
  push:
    branches:
      - develop/0.0.9
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch native app large catalog integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('apps/windows/Orvexa.App/MainWindow.xaml.cs')
          s=p.read_text()
          s=s.replace('const long MaxBundledCatalogBytes=16L*1024*1024;', 'const long MaxBundledCatalogBytes=64L*1024*1024;')
          marker='''    void ApplyVersionText()\n    {'''
          helper='''    IReadOnlyList<PackageItem> LoadBundledCatalogPackages()\n    {\n        var packages=new List<PackageItem>();\n        if(TryReadBundledData("catalog.json",MaxBundledCatalogBytes,out var curatedJson))\n            packages.AddRange(catalogSeed.FromBundledCatalog(curatedJson));\n        if(TryReadBundledData("catalog-large.json",MaxBundledCatalogBytes,out var largeJson))\n            packages.AddRange(catalogSeed.FromBundledCatalog(largeJson));\n\n        return packages\n            .Where(x=>PackagePolicy.IsSafeId(x.Id))\n            .GroupBy(x=>x.Id,StringComparer.OrdinalIgnoreCase)\n            .Select(group=>group.First())\n            .OrderBy(x=>x.Name,StringComparer.OrdinalIgnoreCase)\n            .ToArray();\n    }\n\n'''
          if helper not in s:
              s=s.replace(marker, helper+marker)
          old='''    void EnsureCatalogLoaded()\n    {\n        if(CatalogResults.ItemsSource is not null) return;\n\n        try\n        {\n            if(!TryReadBundledData("catalog.json",MaxBundledCatalogBytes,out var catalogJson))\n            {\n                CatalogEmptyState.Visibility=Visibility.Visible;\n                QueueStatus.Text="The local catalog could not be loaded.";\n                return;\n            }\n\n            catalogItems=catalogSeed.FromBundledCatalog(catalogJson);\n            cache.Merge(catalogItems);\n            ApplyCatalogFilter();\n            QueueStatus.Text=$"Catalog ready | {catalogItems.Count} curated packages";\n        }\n        catch(Exception ex)\n        {\n            crashLog.Write(ex);\n            CatalogEmptyState.Visibility=Visibility.Visible;\n            QueueStatus.Text="The local catalog could not be loaded.";\n        }\n    }'''
          new='''    void EnsureCatalogLoaded()\n    {\n        if(CatalogResults.ItemsSource is not null) return;\n\n        try\n        {\n            catalogItems=LoadBundledCatalogPackages();\n            if(catalogItems.Count==0)\n            {\n                CatalogEmptyState.Visibility=Visibility.Visible;\n                QueueStatus.Text="The local catalog could not be loaded.";\n                return;\n            }\n\n            cache.Merge(catalogItems);\n            ApplyCatalogFilter();\n            QueueStatus.Text=$"Catalog ready | {catalogItems.Count} trusted packages";\n        }\n        catch(Exception ex)\n        {\n            crashLog.Write(ex);\n            CatalogEmptyState.Visibility=Visibility.Visible;\n            QueueStatus.Text="The local catalog could not be loaded.";\n        }\n    }'''
          if old not in s:
              raise SystemExit('EnsureCatalogLoaded block not found')
          s=s.replace(old,new)
          old='''    async void BuildIndex_Click(object sender,RoutedEventArgs e)\n    {\n        await RunOperationAsync("Refreshing local catalog...",async ct=>{\n            ct.ThrowIfCancellationRequested();\n            if(!TryReadBundledData("catalog.json",MaxBundledCatalogBytes,out var catalogJson))\n            {\n                QueueStatus.Text="The bundled Orvexa catalog is unavailable.";\n                return;\n            }\n\n            ct.ThrowIfCancellationRequested();\n            var packages=catalogSeed.FromBundledCatalog(catalogJson);\n            cache.Merge(packages);\n            catalogItems=packages;\n            ApplyCatalogFilter();\n            QueueStatus.Text=$"Local catalog refreshed | {cache.Read().Packages.Count} cached packages";\n        });\n    }'''
          new='''    async void BuildIndex_Click(object sender,RoutedEventArgs e)\n    {\n        await RunOperationAsync("Refreshing local catalog...",async ct=>{\n            ct.ThrowIfCancellationRequested();\n            var packages=LoadBundledCatalogPackages();\n            if(packages.Count==0)\n            {\n                QueueStatus.Text="The bundled Orvexa catalog is unavailable.";\n                return;\n            }\n\n            ct.ThrowIfCancellationRequested();\n            cache.Merge(packages);\n            catalogItems=packages;\n            ApplyCatalogFilter();\n            QueueStatus.Text=$"Local catalog refreshed | {cache.Read().Packages.Count} cached packages";\n        });\n    }'''
          if old not in s:
              raise SystemExit('BuildIndex_Click block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit app patch
        run: |
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add apps/windows/Orvexa.App/MainWindow.xaml.cs
          if git diff --cached --quiet; then
            echo "No app changes."
          else
            git commit -m "Integrate Orvexa 0.0.9 large catalog in native app"
            git push
          fi
