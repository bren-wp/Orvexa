name: Orvexa Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: orvexa-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish stable release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read release metadata
        id: meta
        shell: powershell
        run: |
          $meta=Get-Content build/version.json -Raw | ConvertFrom-Json
          if($meta.channel -ne 'stable') {
            "publish=false" >> $env:GITHUB_OUTPUT
            "version=$($meta.version)" >> $env:GITHUB_OUTPUT
            "tag=v$($meta.version)" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $tag="v$($meta.version)"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $exists=$LASTEXITCODE -eq 0
          $publish=if($exists){'false'}else{'true'}
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "version=$($meta.version)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: QA
        if: steps.meta.outputs.publish == 'true'
        run: npm run qa

      - name: Install Inno Setup
        if: steps.meta.outputs.publish == 'true'
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows Portable and Setup
        if: steps.meta.outputs.publish == 'true'
        shell: powershell
        run: ./installer/build-production.ps1

      - name: Package source, web and QA
        if: steps.meta.outputs.publish == 'true'
        shell: powershell
        run: |
          $version='${{ steps.meta.outputs.version }}'
          git archive --format=zip --output="dist/Orvexa-$version.zip" HEAD
          Compress-Archive -Path "apps/web/*" -DestinationPath "dist/Orvexa-Web-$version.zip" -CompressionLevel Optimal
          $qaRoot=Join-Path $env:RUNNER_TEMP 'orvexa-qa'
          New-Item $qaRoot -ItemType Directory -Force | Out-Null
          Copy-Item qa,tools,shared,apps,build,installer,docs -Destination $qaRoot -Recurse
          Copy-Item package.json,README.md,.gitignore -Destination $qaRoot
          Compress-Archive -Path "$qaRoot/*" -DestinationPath "dist/Orvexa-QA-$version.zip" -CompressionLevel Optimal

          $assets=Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt'
          $assets | ForEach-Object { Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 } |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub release
        if: steps.meta.outputs.publish == 'true'
        shell: powershell
        run: |
          $tag='${{ steps.meta.outputs.tag }}'
          $version='${{ steps.meta.outputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git rev-parse --verify "refs/tags/$tag" *> $null
          if($LASTEXITCODE -ne 0) {
            git tag -a $tag -m "Orvexa $version"
            git push origin $tag
          }

          $assets=@(
            "dist/Orvexa-$version.zip",
            "dist/Orvexa-Web-$version.zip",
            "dist/Orvexa-QA-$version.zip",
            "dist/Orvexa-Portable-$version-x64.zip",
            "dist/Orvexa-Setup-$version-x64.exe",
            "dist/SHA256SUMS.txt",
            "dist/version.json"
          )
          & gh release create $tag @assets --repo "${{ github.repository }}" --title "Orvexa $version" --generate-notes --verify-tag

      - name: Upload release build artifact
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Orvexa-${{ steps.meta.outputs.version }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30