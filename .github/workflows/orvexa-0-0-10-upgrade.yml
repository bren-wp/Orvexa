name: Orvexa 0.0.10 Catalog Upgrade

on:
  push:
    branches:
      - develop/0.0.10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' || startsWith(github.event.head_commit.message, 'chore: generate Orvexa 0.0.10') == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/0.0.10
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch 0.0.10 production code
        run: |
          node tools/set-version.mjs 0.0.10
          node tools/upgrade-0.0.10.mjs patch

      - name: Generate 10k+ large catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORVEXA_LARGE_CATALOG_TARGET: '10500'
          ORVEXA_LARGE_CATALOG_MIN: '10001'
          ORVEXA_LARGE_CATALOG_CONCURRENCY: '48'
        run: node tools/build-winget-large-catalog.mjs

      - name: Update documentation from generated catalog
        run: node tools/upgrade-0.0.10.mjs docs

      - name: QA
        run: npm run qa

      - name: Commit generated 0.0.10 upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json build/version.json README.md docs/CHANGELOG.md tools/build-winget-large-catalog.mjs tools/validate-large-catalog.mjs tools/validate-production-content.mjs tools/upgrade-0.0.10.mjs shared/catalog-large.json apps/windows/Orvexa.App/MainWindow.xaml apps/windows/Orvexa.App/MainWindow.xaml.cs apps/windows/Orvexa.App/Orvexa.App.csproj apps/windows/Orvexa.App/app.manifest installer/Orvexa.iss apps/web/index.html apps/web/data/product.json
          git commit -m "chore: generate Orvexa 0.0.10 catalog upgrade"
          git push origin HEAD:develop/0.0.10
