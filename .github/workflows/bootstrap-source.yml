name: Bootstrap Orvexa source

on:
  push:
    branches:
      - develop/0.0.3
    paths:
      - ".github/bootstrap/orvexa-0.0.3.zip.b64"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: develop/0.0.3
          fetch-depth: 0

      - name: Restore Orvexa source tree
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD=".github/bootstrap/orvexa-0.0.3.zip.b64"
          test -s "$PAYLOAD"
          base64 --decode "$PAYLOAD" > "$RUNNER_TEMP/orvexa-0.0.3.zip"
          unzip -t "$RUNNER_TEMP/orvexa-0.0.3.zip"
          mkdir -p "$RUNNER_TEMP/orvexa-source"
          unzip -q "$RUNNER_TEMP/orvexa-0.0.3.zip" -d "$RUNNER_TEMP/orvexa-source"
          cp -a "$RUNNER_TEMP/orvexa-source/." .
          rm -rf .github/bootstrap

      - name: Verify restored source
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f package.json
          test -f apps/windows/Orvexa.App/Orvexa.App.csproj
          test -f apps/web/index.html
          test -f shared/catalog.json
          test -f qa/orvexa.test.mjs
          test -f .github/workflows/ci.yml
          node --check apps/web/js/app.js
          node tools/validate-catalog.mjs
          npm test

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Release Orvexa 0.0.3"
          git push origin HEAD:develop/0.0.3
