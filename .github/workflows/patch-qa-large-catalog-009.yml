name: Orvexa Patch QA Large Catalog 0.0.9

on:
  push:
    branches:
      - develop/0.0.9
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch QA for bounded large catalog
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('qa/orvexa.test.mjs')
          s=p.read_text()
          old='''test('bundled Windows data is read through bounded file infrastructure',()=>{\n  assert.match(code,/TryReadBundledData/);\n  assert.match(code,/MaxBundledCatalogBytes=16L\\*1024\\*1024/);\n  assert.match(code,/MaxBundledProfilesBytes=2L\\*1024\\*1024/);\n  assert.doesNotMatch(code,/File\\.ReadAllText|File\\.ReadAllTextAsync/);\n});'''
          new='''test('bundled Windows data is read through bounded file infrastructure',()=>{\n  assert.match(code,/TryReadBundledData/);\n  assert.match(code,/MaxBundledCatalogBytes=64L\\*1024\\*1024/);\n  assert.match(code,/MaxBundledProfilesBytes=2L\\*1024\\*1024/);\n  assert.match(code,/TryReadBundledData\\("catalog-large\\.json",MaxBundledCatalogBytes,out var largeJson\\)/);\n  assert.match(proj,/catalog-large\\.json/);\n  assert.doesNotMatch(code,/File\\.ReadAllText|File\\.ReadAllTextAsync/);\n});'''
          if old not in s:
            raise SystemExit('Target QA block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit QA patch
        run: |
          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add qa/orvexa.test.mjs
          if git diff --cached --quiet; then
            echo "No QA changes."
          else
            git commit -m "Update Orvexa 0.0.9 bounded large catalog QA"
            git push
          fi
