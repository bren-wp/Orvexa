name: Prepare Orvexa 0.0.5
# rerun after protocol QA alignment

on:
  push:
    branches:
      - develop/0.0.5
    paths:
      - ".github/workflows/prepare-005.yml"

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/0.0.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize 0.0.5 version
        run: node tools/set-version.mjs 0.0.5
      - name: Validate synchronized source
        run: npm run qa
      - name: Commit version metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/version.json package.json apps/web/index.html apps/web/data/product.json README.md apps/windows/Orvexa.App/Orvexa.App.csproj apps/windows/Orvexa.App/app.manifest installer/Orvexa.iss installer/build-production.ps1
          git commit -m "Synchronize Orvexa 0.0.5 version metadata"
          git push origin HEAD:develop/0.0.5
