name: Diagnose Portable startup
# final-name publish validation

on:
  push:
    branches:
      - develop/0.0.6
    paths:
      - ".github/workflows/portable-smoke-006.yml"

permissions:
  contents: read

jobs:
  portable-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build production artifacts
        shell: powershell
        run: ./installer/build-production.ps1
      - name: Launch Portable EXE
        shell: powershell
        run: |
          $version=(Get-Content build/version.json -Raw | ConvertFrom-Json).version
          $exe=Resolve-Path "dist/Orvexa-Portable-$version-x64.exe"
          $state=Join-Path $env:LOCALAPPDATA "Orvexa"
          Remove-Item $state -Recurse -Force -ErrorAction SilentlyContinue

          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12

          if($p.HasExited) {
            Write-Host "Portable process exited early with code $($p.ExitCode)."
            $log=Join-Path $state "crash.log"
            if(Test-Path $log) {
              Write-Host "===== Orvexa crash.log ====="
              Get-Content $log -Raw
              Write-Host "============================"
            }
            throw "Portable EXE exited before the startup smoke-test window completed."
          }

          Write-Host "Portable process remained alive after startup."
          Stop-Process -Id $p.Id -Force
