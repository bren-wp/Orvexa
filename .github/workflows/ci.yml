name: Orvexa CI

on:
  push:
    branches: [ main, 'develop/**', 'release/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  qa:
    name: QA and web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run qa

  windows-build:
    name: Windows release build smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build production artifacts
        shell: powershell
        run: ./installer/build-production.ps1
      - name: Verify release artifacts
        shell: powershell
        run: |
          $version=(Get-Content build/version.json -Raw | ConvertFrom-Json).version
          if(-not (Test-Path "dist/Orvexa-Portable-$version-x64.zip")) { throw "Portable artifact missing." }
          if(-not (Test-Path "dist/Orvexa-Setup-$version-x64.exe")) { throw "Setup artifact missing." }
          if(-not (Test-Path "dist/SHA256SUMS.txt")) { throw "Checksum manifest missing." }
