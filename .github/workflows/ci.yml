name: Orvexa CI

on:
  push:
    branches: [ main, 'develop/**', 'release/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: orvexa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: QA and web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run qa

  windows-build:
    name: Windows release build smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build production artifacts
        shell: powershell
        run: ./installer/build-production.ps1
      - name: Verify release artifacts
        shell: powershell
        run: |
          $version=(Get-Content build/version.json -Raw | ConvertFrom-Json).version
          if(-not (Test-Path "dist/Orvexa-Portable-$version-x64.exe")) { throw "Portable executable missing." }
          if(-not (Test-Path "dist/Orvexa-Portable-$version-x64.zip")) { throw "Portable archive missing." }
          if(-not (Test-Path "dist/Orvexa-Setup-$version-x64.exe")) { throw "Setup artifact missing." }
          if(-not (Test-Path "dist/SHA256SUMS.txt")) { throw "Checksum manifest missing." }

      - name: Launch Portable EXE
        shell: powershell
        run: |
          $version=(Get-Content build/version.json -Raw | ConvertFrom-Json).version
          $exe=Resolve-Path "dist/Orvexa-Portable-$version-x64.exe"
          $state=Join-Path $env:LOCALAPPDATA "Orvexa"
          $diagnostics=Join-Path $PWD "diagnostics"
          Remove-Item $state -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $diagnostics -ItemType Directory -Force | Out-Null

          $process=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12

          if($process.HasExited) {
            $log=Join-Path $state "crash.log"
            if(Test-Path $log) {
              Copy-Item $log (Join-Path $diagnostics "portable-crash.log") -Force
              Get-Content $log -Raw
            }
            throw "Portable EXE exited during startup smoke test with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force

      - name: Upload Portable startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Orvexa-portable-startup-diagnostics
          path: diagnostics/*
          if-no-files-found: ignore
          retention-days: 14
